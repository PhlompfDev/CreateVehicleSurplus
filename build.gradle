plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // Create, Ponder (which carries Catnip) and Flywheel.
    maven {
        name = 'CreateMod'
        url = uri('https://maven.createmod.net')
    }
    // Create Diesel Generators has no maven of its own; Modrinth mirrors every release.
    maven {
        name = 'Modrinth'
        url = uri('https://api.modrinth.com/maven')
        content { includeGroup 'maven.modrinth' }
    }
    // CC: Tweaked API jars.
    maven {
        name = 'SquidDev'
        url = uri('https://maven.squiddev.cc')
        content { includeGroup 'cc.tweaked' }
    }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // FML's early loading window intermittently crashes the dev client
            // on this machine (fox animation texture read after the union FS is
            // closed). Purely cosmetic, so skip it.
            systemProperty 'fml.earlyprogresswindow', 'false'
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Headless in-game tests: `gradlew.bat runGameTestServer`. Exit code != 0 on any failure.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // Own directory so tests can run while a dev client is open (Sable locks its
            // natives and the log files in the game directory).
            gameDirectory = project.file('run-gametest')
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Create's "slim" artifact excludes the nested Flywheel/Ponder/Registrate jars,
    // so each one is declared explicitly below at the exact version Create 6.0.10
    // bundles. NeoForge mods ship in Mojang mappings, so release jars compile
    // directly against the dev environment.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}") { transitive = false }
    implementation("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") { transitive = false }
    // Registrate's MC1.21 line is not on a public maven; this jar is the one
    // extracted from Create 6.0.10's META-INF/jarjar.
    implementation files("libs/Registrate-${registrate_version}.jar")

    // Create Diesel Generators: compile against IEngine/FuelType, run with it.
    compileOnly("maven.modrinth:create-diesel-generators:${cdg_version}") { transitive = false }
    runtimeOnly("maven.modrinth:create-diesel-generators:${cdg_version}") { transitive = false }

    // Create Propulsion: Simulated is optional and its thruster classes moved packages between
    // releases, so the compat code matches thrusters by registry id and never compiles against
    // it. It is only on the runtime classpath (with the Aeronautics bundle it needs) for the game tests.
    runtimeOnly("maven.modrinth:create-propulsion-simulated:${propulsion_version}") { transitive = false }
    runtimeOnly("maven.modrinth:create-aeronautics:${aeronautics_version}") { transitive = false }
    // Sable is optional too, but the Gimbal Controller compiles against its physics API
    // (compat/sable only). The companion jar is vendored from Sable's META-INF/jarjar.
    compileOnly("maven.modrinth:sable:${sable_version}") { transitive = false }
    compileOnly files("libs/sable-companion-common-1.21.1-1.6.0.jar")
    runtimeOnly("maven.modrinth:sable:${sable_version}") { transitive = false }

    // CC: Tweaked is optional: the transmission peripheral compiles against its API and is only
    // registered when the mod is present. The runtime jar is there for the dev client and game tests.
    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cct_api_version}")
    runtimeOnly("maven.modrinth:cc-tweaked:${cct_runtime_version}") { transitive = false }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : create_version_range,
            cdg_version_range      : cdg_version_range,
            propulsion_version_range: propulsion_version_range,
            sable_version_range      : sable_version_range,
            cct_version_range      : cct_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
